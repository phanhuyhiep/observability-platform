apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: observability
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai
          image: ai-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: detection-db-secret
                  key: DATABASE_URL
            - name: PROMETHEUS_URL
              value: "http://prometheus-kube-prometheus-prometheus.observability.svc.cluster.local:9090"
            - name: LOKI_URL
              value: "http://loki.observability.svc.cluster.local:3100"
            - name: TEMPO_URL
              value: "http://tempo.observability.svc.cluster.local:3200"
            - name: RCA_SERVICE_URL
              value: "http://rca-service:8082"
            - name: AI_CONFIG_PATH
              value: "/app/ai/config/ai-config.yaml"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-service-secret
                  key: GEMINI_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-service-secret
                  key: OPENAI_API_KEY
                  optional: true
            - name: LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: ai-service-secret
                  key: LLM_PROVIDER
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: observability
  labels:
    app: ai-service
spec:
  type: NodePort
  selector:
    app: ai-service
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083
