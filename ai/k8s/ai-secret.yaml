apiVersion: v1
kind: Secret
metadata:
  name: ai-service-secret
  namespace: observability
type: Opaque
stringData:
  # Optional: Tùy chọn điền Gemini API Key hoặc OpenAI API Key để dùng LLM Cloud
  # Nếu để trống, hệ thống sẽ tự động dùng "sre_expert" (Offline SRE Expert Engine không cần internet)
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  LLM_PROVIDER: "sre_expert"
