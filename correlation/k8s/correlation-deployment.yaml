apiVersion: apps/v1
kind: Deployment
metadata:
  name: correlation-service
  namespace: observability
  labels:
    app: correlation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: correlation-service
  template:
    metadata:
      labels:
        app: correlation-service
    spec:
      containers:
        - name: correlation
          image: correlation-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: detection-db-secret
                  key: DATABASE_URL
            - name: TEMPO_URL
              value: "http://tempo.observability.svc.cluster.local:3200"
            - name: CORRELATION_CONFIG_PATH
              value: "/app/config/correlation-config.yaml"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: correlation-service
  namespace: observability
  labels:
    app: correlation-service
spec:
  selector:
    app: correlation-service
  ports:
    - port: 8081
      targetPort: 8081
