# Docker Compose for local development
version: "3.9"

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: detection
      POSTGRES_PASSWORD: detection2026
      POSTGRES_DB: detection_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detection -d detection_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Detection Service
  detection-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://detection:detection2026@postgres:5432/detection_db"
      PROMETHEUS_URL: "http://host.docker.internal:9090"
      LOKI_URL: "http://host.docker.internal:3100"
      DETECTION_CONFIG_PATH: "/app/config/detection-config.yaml"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./rules:/app/rules

volumes:
  postgres_data:
