apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
# PostgreSQL for Detection Service
apiVersion: v1
kind: Secret
metadata:
  name: detection-db-secret
  namespace: observability
type: Opaque
stringData:
  POSTGRES_USER: detection
  POSTGRES_PASSWORD: detection2026
  POSTGRES_DB: detection_db
  DATABASE_URL: "postgresql://detection:detection2026@detection-postgres:5432/detection_db"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: detection-postgres-pvc
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-postgres
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: detection-postgres
  template:
    metadata:
      labels:
        app: detection-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: detection-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: detection-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: detection-db-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: detection-postgres-pvc
        - name: init-scripts
          configMap:
            name: detection-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: detection-postgres
  namespace: observability
spec:
  selector:
    app: detection-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# Detection Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-service
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: detection-service
  template:
    metadata:
      labels:
        app: detection-service
    spec:
      containers:
        - name: detection
          image: detection-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: detection-db-secret
                  key: DATABASE_URL
            - name: PROMETHEUS_URL
              value: "http://prometheus-kube-prometheus-prometheus.observability.svc.cluster.local:9090"
            - name: LOKI_URL
              value: "http://loki.observability.svc.cluster.local:3100"
            - name: DETECTION_NAMESPACE
              value: "default"
            - name: DETECTION_CONFIG_PATH
              value: "/app/config/detection-config.yaml"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: detection-service
  namespace: observability
spec:
  selector:
    app: detection-service
  ports:
    - port: 8080
      targetPort: 8080
