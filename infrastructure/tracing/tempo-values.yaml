# Tempo Helm values
# Single-binary mode for lab environment

tempo:
  memBallastSizeMbs: 64
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  retention: 168h                   # 7 days
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

persistence:
  enabled: true
  size: 5Gi

# Disable tempo-query (Jaeger UI) to save resources
tempoQuery:
  enabled: false
