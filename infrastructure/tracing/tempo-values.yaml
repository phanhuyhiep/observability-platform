# Tempo Helm values
# Single-binary mode for lab environment

tempo:
  memBallastSizeMbs: 64
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  retention: 168h                   # 7 days
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  # Tăng thời gian probe để tránh bị Kubelet kill khi đang khởi động và nạp WAL/ring
  livenessProbe:
    httpGet:
      path: /ready
      port: 3200
    initialDelaySeconds: 90
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /ready
      port: 3200
    initialDelaySeconds: 45
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

persistence:
  enabled: true
  size: 5Gi

# Disable tempo-query (Jaeger UI) to save resources
tempoQuery:
  enabled: false

