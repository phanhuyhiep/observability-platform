apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-service
  namespace: observability
  labels:
    app: rca-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rca-service
  template:
    metadata:
      labels:
        app: rca-service
    spec:
      containers:
        - name: rca
          image: rca-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: detection-db-secret
                  key: DATABASE_URL
            - name: PROMETHEUS_URL
              value: "http://prometheus-kube-prometheus-prometheus.observability.svc.cluster.local:9090"
            - name: LOKI_URL
              value: "http://loki.observability.svc.cluster.local:3100"
            - name: TEMPO_URL
              value: "http://tempo.observability.svc.cluster.local:3200"
            - name: RCA_CONFIG_PATH
              value: "/app/config/rca-config.yaml"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alert-notification-secret
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: alert-notification-secret
                  key: TELEGRAM_CHAT_ID
                  optional: true
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alert-notification-secret
                  key: SLACK_WEBHOOK_URL
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rca-service
  namespace: observability
  labels:
    app: rca-service
spec:
  type: NodePort
  selector:
    app: rca-service
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
